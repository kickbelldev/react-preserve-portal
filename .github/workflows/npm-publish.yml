name: Publish npm package
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      artifact-id: ${{ steps.archive.outputs.artifact-id }}
    env:
      NX_DAEMON: 'false'
      NX_TUI: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node scripts/release.mjs context
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm exec nx exec --projects=@charley-kim/react-preserve-portal -- node --test "$GITHUB_WORKSPACE/scripts/release-policy.test.mjs"
      - run: corepack pnpm exec nx run-many --targets=test,typecheck,lint --all --parallel=2 --skip-nx-cache --output-style=static
      - run: corepack pnpm build --skip-nx-cache
        env:
          NODE_ENV: production
      - run: |
          mkdir release
          corepack pnpm --dir packages/react-preserve-portal pack --pack-destination "$GITHUB_WORKSPACE/release"
          node scripts/release.mjs prepare
      - run: |
          for react in 18.0.0 18.2.0 18.3.1 19.0.0 19.1.0 19.2.3; do
            node scripts/verify-package.mjs release/*.tgz "$react"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: archive
        with:
          name: npm-release
          path: release/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          path: release/
          merge-multiple: true
          digest-mismatch: error
      - name: Rehearse or publish the verified archive with npm OIDC
        run: node scripts/release.mjs publish
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: registry-confirmation
          path: release/registry-confirmation.json
          if-no-files-found: ignore
          retention-days: 90
