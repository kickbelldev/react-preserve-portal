name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NX_DAEMON: 'false'
      NX_TUI: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm exec nx run-many --targets=test,typecheck,lint --all --parallel=2 --skip-nx-cache --output-style=static
      - run: corepack pnpm build --skip-nx-cache
        env:
          NODE_ENV: production
      - run: |
          mkdir -p /tmp/portal-release
          corepack pnpm --dir packages/react-preserve-portal pack --pack-destination /tmp/portal-release
      - run: node scripts/verify-package.mjs /tmp/portal-release/*.tgz 18
      - run: node scripts/verify-package.mjs /tmp/portal-release/*.tgz 19
  browser:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        react: ['18.3.1', '19.2.3']
    env:
      NX_DAEMON: 'false'
      NX_TUI: 'false'
      REACT_MODULES: /tmp/portal-browser-react/node_modules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: npm install --prefix /tmp/portal-browser-react --ignore-scripts --no-audit --no-fund react@${{ matrix.react }} react-dom@${{ matrix.react }}
      - run: python -m pip install playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/lifecycle-smoke.py
      - if: matrix.react == '19.2.3'
        run: corepack pnpm exec nx run demo:build --skip-nx-cache --output-style=static
        env:
          NODE_ENV: production
      - if: matrix.react == '19.2.3'
        run: python scripts/demo-smoke.py
