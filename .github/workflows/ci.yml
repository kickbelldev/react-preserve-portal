name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NX_DAEMON: 'false'
      NX_TUI: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm exec nx exec --projects=@charley-kim/react-preserve-portal -- node --test "$GITHUB_WORKSPACE/scripts/release-policy.test.mjs"
      - run: corepack pnpm exec nx run-many --targets=test,typecheck,lint --all --parallel=2 --skip-nx-cache --output-style=static
      - run: corepack pnpm build --skip-nx-cache
        env:
          NODE_ENV: production
      - run: node scripts/check-size.mjs
      - run: corepack pnpm exec nx run docs:check-output --output-style=static
        env:
          NODE_ENV: production
      - run: |
          mkdir -p /tmp/portal-release
          corepack pnpm --dir packages/react-preserve-portal pack --pack-destination /tmp/portal-release
      - run: |
          for react in 18.0.0 18.2.0 18.3.1 19.0.0 19.1.0 19.2.3; do
            node scripts/verify-package.mjs /tmp/portal-release/*.tgz "$react"
          done
  browser:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        react: ['18.3.1', '19.2.3']
        browser: ['chromium', 'firefox', 'webkit']
        include:
          - { react: '18.0.0', browser: chromium }
          - { react: '18.2.0', browser: chromium }
          - { react: '19.0.0', browser: chromium }
          - { react: '19.1.0', browser: chromium }
    env:
      NX_DAEMON: 'false'
      NX_TUI: 'false'
      REACT_MODULES: /tmp/portal-browser-react/node_modules
      PORTAL_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: npm install --prefix /tmp/portal-browser-react --ignore-scripts --no-audit --no-fund react@${{ matrix.react }} react-dom@${{ matrix.react }}
      - run: python -m pip install playwright==1.62.0
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - run: python scripts/lifecycle-smoke.py
      - if: matrix.react == '19.2.3'
        run: corepack pnpm exec nx run-many --target=build --projects=demo,docs --skip-nx-cache --output-style=static
        env:
          NODE_ENV: production
      - if: matrix.react == '19.2.3'
        run: python scripts/demo-smoke.py
      - if: matrix.react == '19.2.3'
        run: python scripts/docs-smoke.py --local
